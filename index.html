<style>
/* Layout: coach's tactics board. Role picker top right; pitch left, step card right; stacks on phones with sticky controls. */
:root {
  --bg: #E9EDE8;
  --board: #F7F9F5;
  --line: #A9BBAE;
  --ink: #1C2822;
  --muted: #5B6B61;
  --us: #1E5BC6;
  --us-ink: #FFFFFF;
  --them: #C93F2A;
  --acc: #E3A11A;
  --acc-ink: #1C2822;
  --zone: rgba(227, 161, 26, 0.16);
  --zone-bad: rgba(201, 63, 42, 0.12);
  --rule: #D3DBD4;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131C17; --board: #1B2720; --line: #4C6556; --ink: #E6EEE8; --muted: #9DB0A3;
    --us: #6FA4FF; --us-ink: #0E1A2E; --them: #FF8670; --acc: #F4C04E; --acc-ink: #1B1405;
    --zone: rgba(244, 192, 78, 0.14); --zone-bad: rgba(255, 134, 112, 0.13); --rule: #2C3B32;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131C17; --board: #1B2720; --line: #4C6556; --ink: #E6EEE8; --muted: #9DB0A3;
  --us: #6FA4FF; --us-ink: #0E1A2E; --them: #FF8670; --acc: #F4C04E; --acc-ink: #1B1405;
  --zone: rgba(244, 192, 78, 0.14); --zone-bad: rgba(255, 134, 112, 0.13); --rule: #2C3B32;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 40px; }

.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px 24px; margin-bottom: 22px; }
.titleblock { display: grid; gap: 4px; min-width: 0; flex: 1 1 380px; }
.eyebrow { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 14px; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 8vw, 72px); line-height: .9; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
h1 .num { color: var(--acc); }
.tag { color: var(--muted); max-width: 60ch; margin: 6px 0 0; }

.picker { display: grid; gap: 6px; flex: 0 0 auto; }
.picker span { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--muted); }
.picker select {
  appearance: none; -webkit-appearance: none;
  font: 700 20px/1 var(--font-display); text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink); background-color: var(--board);
  border: 1.5px solid var(--ink); border-radius: 8px;
  padding: 12px 44px 12px 14px; min-width: 220px; max-width: 100%; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--acc) 50%), linear-gradient(135deg, var(--acc) 50%, transparent 50%);
  background-position: calc(100% - 22px) 52%, calc(100% - 15px) 52%;
  background-size: 7px 7px, 7px 7px; background-repeat: no-repeat;
}
.picker select:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
#board { width: 100%; max-width: 470px; height: auto; display: block; background: var(--board); border-radius: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { flex: none; }

.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 18px; min-width: 0; }
.count { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; margin: 2px 0 0; text-transform: uppercase; text-wrap: balance; }
.body p { margin: 0 0 10px; max-width: 58ch; }
.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.goals li { display: grid; gap: 2px; padding-left: 14px; border-left: 3px solid var(--acc); }
.goals b { font-family: var(--font-display); font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
.cue { display: grid; gap: 2px; padding: 12px 14px; background: var(--board); border: 1px solid var(--rule); border-radius: 8px; }
.cue small { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--muted); }
.cue strong { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { font: 700 17px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; padding: 12px 18px; border-radius: 8px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
button.primary { background: var(--ink); color: var(--board); }
button:disabled { opacity: .35; cursor: default; }
button:focus-visible, .steps button:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
#replay { margin-left: auto; border-color: var(--acc); }

.steps { list-style: none; margin: 0; padding: 14px 0 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; counter-reset: s; }
.steps button { all: unset; cursor: pointer; display: flex; gap: 8px; align-items: baseline; font-size: 14px; color: var(--muted); padding: 4px 0; counter-increment: s; }
.steps button::before { content: counter(s); font: 700 13px var(--font-display); min-width: 16px; font-variant-numeric: tabular-nums; }
.steps button[aria-current="step"] { color: var(--ink); font-weight: 700; }
.steps button[aria-current="step"]::before { color: var(--acc); }

/* SVG */
.pitch-line { fill: none; stroke: var(--line); stroke-width: 3; }
.pl { transition: transform .6s cubic-bezier(.4,.1,.2,1), opacity .4s; }
.pl text { font: 700 17px var(--font-display); text-anchor: middle; letter-spacing: .02em; pointer-events: none; }
.us circle { fill: var(--us); stroke: var(--board); stroke-width: 3; }
.us text { fill: var(--us-ink); }
.us.hl circle { fill: var(--acc); stroke: var(--ink); stroke-width: 3; }
.us.hl text { fill: var(--acc-ink); font-size: 19px; }
.us.dim { opacity: .38; }
.them circle { fill: var(--board); stroke: var(--them); stroke-width: 4; }
.them line { stroke: var(--them); stroke-width: 3.5; stroke-linecap: round; }
.them.off { opacity: 0; }
.ball circle { fill: #FFFFFF; stroke: #1C2822; stroke-width: 2.5; }
.ball.off { opacity: 0; }
.zone { fill: var(--zone); stroke: var(--acc); stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; }
.zone.bad { fill: var(--zone-bad); stroke: var(--them); }
.offline { stroke: var(--them); stroke-width: 2.5; stroke-dasharray: 12 8; opacity: .8; }
.ar { fill: none; stroke-width: 4; stroke-linecap: round; }
.ar.run { stroke: var(--us); stroke-dasharray: 10 9; }
.ar.drib { stroke: var(--us); stroke-dasharray: 1 8; stroke-width: 5; }
.ar.pass { stroke: var(--ink); }
.ar.shot { stroke: var(--acc); stroke-width: 5; }
.ar.opp { stroke: var(--them); stroke-dasharray: 10 9; }
.ar.bad { stroke: var(--them); }
.ar.link { stroke: var(--muted); stroke-dasharray: 4 8; stroke-width: 2.5; opacity: .8; }
.ghost { fill: none; stroke: var(--us); stroke-width: 3; stroke-dasharray: 5 6; }
.xmark { stroke: var(--them); stroke-width: 5; stroke-linecap: round; }
.note { font: 700 22px var(--font-display); fill: var(--ink); paint-order: stroke; stroke: var(--board); stroke-width: 7px; stroke-linejoin: round; letter-spacing: .01em; }
.note.big { font-size: 26px; fill: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.fresh { animation: fadein .5s .45s both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.mk-us { fill: var(--us); } .mk-ink { fill: var(--ink); } .mk-them { fill: var(--them); } .mk-acc { fill: var(--acc); }

@media (max-width: 760px) {
  .wrap { padding-inline: 16px; padding-block: 20px 0; }
  .grid { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .picker { flex: 1 1 100%; }
  .picker select { width: 100%; }
  #board { max-height: 66vh; width: auto; max-width: 100%; }
  .panel { position: static; }
  h2 { font-size: 34px; }
  .controls { position: sticky; bottom: 0; background: var(--bg); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); margin-inline: -16px; padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .pl { transition: none; }
  .fresh { animation: none; }
}
</style>

<script>
const NS = 'http://www.w3.org/2000/svg';
const BASE = { GK:[340,955], LB:[170,800], CB:[340,825], RB:[510,800], CDM:[340,690], LM:[120,560], RM:[560,560], CAM:[340,470], LW:[110,300], ST:[340,250], RW:[570,300] };

      { ...DELAYED_RUN, nav:'Delayed run', title:'The delayed run',

               ['Distribute wide','Roll or throw it to the side. Never into the middle.']],

/* ---------- engine ---------- */
const $ = id => document.getElementById(id);
const L = { zones:$('layer-zones'), arrows:$('layer-arrows'), players:$('layer-players'), notes:$('layer-notes'), sampler:$('sampler') };
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MK = { run:'m-us', drib:'m-us', pass:'m-ink', shot:'m-acc', opp:'m-them', bad:'m-them' };

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function setPos(node, p) { node.style.transform = `translate(${p[0]}px, ${p[1]}px)`; }

const nodes = {};
for (const id of OPP) {
  const g = el('g', { class:'pl them off' }, L.players);
  el('circle', { r:18 }, g);
  el('line', { x1:-7, y1:-7, x2:7, y2:7 }, g); el('line', { x1:7, y1:-7, x2:-7, y2:7 }, g);
  nodes[id] = g; setPos(g, [340, 120]);
}
for (const id in BASE) {
  const g = el('g', { class:'pl us' }, L.players);
  el('circle', { r:22 }, g);
  const t = el('text', { y:6 }, g); t.textContent = id;
  nodes[id] = g; setPos(g, BASE[id]);
}
const ball = el('g', { class:'pl ball off' }, L.players);
el('circle', { r:9 }, ball);
setPos(ball, [340, 500]);

const sel = $('role');
ROLES.forEach(r => { const o = document.createElement('option'); o.value = r.key; o.textContent = r.option; sel.appendChild(o); });

let role = ROLES[0], cur = 0, raf = 0, timer = 0;

function note(n, parent) {
  const t = el('text', { x:n.x, y:n.y, class:'note' + (n.big ? ' big' : ''), 'text-anchor': n.anchor || 'middle' }, parent);
  t.textContent = n.text;
}
function xmark(x, y, parent) {
  el('line', { x1:x-12, y1:y-12, x2:x+12, y2:y+12, class:'xmark' }, parent);
  el('line', { x1:x+12, y1:y-12, x2:x-12, y2:y+12, class:'xmark' }, parent);
}
function stopPlay() { cancelAnimationFrame(raf); clearTimeout(timer); L.sampler.textContent = ''; }

function setRole(key, keepStep) {
  role = ROLES.find(r => r.key === key) || ROLES[0];
  sel.value = role.key;
  $('role-name').textContent = role.name;
  $('role-num').textContent = role.num;
  $('role-tag').textContent = role.tag;
  $('lg-role').textContent = role.name;
  const list = $('steps'); list.textContent = '';
  role.steps.forEach((s, i) => {
    const li = document.createElement('li'); const b = document.createElement('button');
    b.type = 'button'; b.textContent = s.nav; b.addEventListener('click', () => go(i));
    li.appendChild(b); list.appendChild(li);
  });
  try { localStorage.setItem('pb-role', role.key); } catch (e) {}
  try { if (location.hash.slice(1) !== role.key) history.replaceState(null, '', '#' + role.key); } catch (e) {}
  go(keepStep || 0);
}

function go(i) {
  stopPlay();
  const steps = role.steps;
  cur = Math.max(0, Math.min(steps.length - 1, i));
  const s = steps[cur];
  const hl = s.hl || role.hl;
  for (const id in BASE) {
    const n = nodes[id];
    n.style.transition = '';
    setPos(n, (s.pos && s.pos[id]) || BASE[id]);
    n.classList.toggle('hl', hl.includes(id));
    n.classList.toggle('dim', !!s.focus && !s.focus.includes(id));
  }
  for (const id of OPP) {
    const n = nodes[id], p = s.opp && s.opp[id];
    n.style.transition = '';
    n.classList.toggle('off', !p);
    if (p) setPos(n, p);
  }
  ball.style.transition = '';
  ball.classList.toggle('off', !s.ball);
  if (s.ball) setPos(ball, s.ball);

  for (const k of ['zones','arrows','notes']) L[k].textContent = '';
  const fresh = reduced ? '' : ' fresh';
  (s.zones || []).forEach(z => {
    el('rect', { x:z.rect[0], y:z.rect[1], width:z.rect[2], height:z.rect[3], rx:18, class:'zone' + (z.bad ? ' bad' : '') + fresh }, L.zones);
    if (z.label) note({ x:z.lx, y:z.ly, text:z.label, big:true }, L.notes);
  });
  (s.lines || []).forEach(l => {
    el('path', { d:l.d, class:'offline' + fresh }, L.zones);
    if (l.label) note({ x:l.lx, y:l.ly, text:l.label, anchor:l.anchor }, L.notes);
  });
  (s.ghosts || []).forEach(g => el('circle', { cx:g[0], cy:g[1], r:22, class:'ghost' + fresh }, L.arrows));
  (s.arrows || []).forEach(a => {
    const attrs = { d:a.d, class:'ar ' + a.t + fresh };
    if (MK[a.t]) attrs['marker-end'] = `url(#${MK[a.t]})`;
    el('path', attrs, L.arrows);
  });
  (s.crosses || []).forEach(c => {
    el('path', { d:c.line, class:'ar opp' + fresh, opacity:.55 }, L.arrows);
    xmark(c.x, c.y, el('g', { class:fresh.trim() }, L.notes));
  });
  (s.xs || []).forEach(p => xmark(p[0], p[1], el('g', { class:fresh.trim() }, L.notes)));
  (s.notes || []).forEach(n => note(n, L.notes));

  $('count').textContent = `Step ${cur + 1} of ${steps.length}`;
  $('title').textContent = s.title;
  const body = $('body'); body.textContent = '';
  if (s.goals) {
    const ul = document.createElement('ul'); ul.className = 'goals';
    s.goals.forEach(([h, d]) => {
      const li = document.createElement('li'); const b = document.createElement('b'); const sp = document.createElement('span');
      b.textContent = h; sp.textContent = d; li.append(b, sp); ul.appendChild(li);
    });
    body.appendChild(ul);
  } else {
    s.body.forEach(t => { const p = document.createElement('p'); p.textContent = t; body.appendChild(p); });
  }
  $('cue').textContent = s.cue;
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === steps.length - 1;
  $('replay').hidden = !s.play;
  document.querySelectorAll('#steps button').forEach((b, j) => { if (j === cur) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  if (s.play && !reduced) timer = setTimeout(play, 750);
}

function ease(k) { return k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2; }

function play() {
  stopPlay();
  const s = role.steps[cur];
  if (!s.play) return;
  const tracks = s.play.map(p => {
    const path = el('path', { d:p.d }, L.sampler);
    const node = p.who === 'ball' ? ball : nodes[p.who];
    node.style.transition = 'none';
    const pt = path.getPointAtLength(0); setPos(node, [pt.x, pt.y]);
    return { ...p, path, node, len: path.getTotalLength() };
  });
  const start = performance.now();
  const frame = now => {
    let done = true;
    for (const t of tracks) {
      let k = (now - start - (t.delay || 0)) / t.dur;
      if (k < 1) done = false;
      k = Math.max(0, Math.min(1, k));
      const pt = t.path.getPointAtLength(ease(k) * t.len);
      setPos(t.node, [pt.x, pt.y]);
    }
    if (!done) raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}

sel.addEventListener('change', () => setRole(sel.value));
$('prev').addEventListener('click', () => go(cur - 1));
$('next').addEventListener('click', () => go(cur + 1));
$('replay').addEventListener('click', () => { go(cur); clearTimeout(timer); setTimeout(play, 650); });
document.addEventListener('keydown', e => {
  if (e.target === sel) return;
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (k && k !== role.key) setRole(k); });

let startKey = location.hash.slice(1);
if (!ROLES.some(r => r.key === startKey)) { try { startKey = localStorage.getItem('pb-role') || ''; } catch (e) { startKey = ''; } }
for (const id in nodes) nodes[id].style.transition = 'none';
setRole(startKey);
</script>
