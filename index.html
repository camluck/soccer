<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Magic soccer: weekly practice plans, position walkthroughs, set pieces, and match-day goals.">
<title>Magic Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#home" aria-label="Magic home">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="16" fill="var(--us)"/>
        <path d="M17 6.5 L19.6 13.6 L27 14.1 L21.2 18.7 L23.1 26 L17 21.9 L10.9 26 L12.8 18.7 L7 14.1 L14.4 13.6 Z" fill="#FFFFFF"/>
        <circle cx="27.5" cy="6.5" r="1.6" fill="#FFFFFF"/><circle cx="6" cy="27" r="1.2" fill="#FFFFFF"/>
      </svg>
      <div><b>Magic</b><span>3-4-3 Diamond playbook</span></div>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#practice" data-view="practice">Practice</a>
      <a href="#playbook" data-view="play">Positions</a>
      <a href="#set" data-view="set">Set pieces</a>
      <a href="#match" data-view="match">Match day</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="v-home" hidden></section>

  <div class="pagehead" id="pagehead">
    <div class="eyebrow" id="eyebrow"></div>
    <h1><span id="page-title"></span> <span class="num" id="page-num"></span></h1>
    <p class="tag" id="page-tag"></p>
  </div>

  <div class="chooser" id="chooser"></div>

  <!-- Practice: this week's concepts -->
  <section id="v-practice" hidden>
    <div id="practice-groups"></div>
  </section>

  <!-- Match day: one goal per player -->
  <section id="v-match" hidden>
    <div class="deck" id="deck">
      <button type="button" class="deck-arrow" id="deck-prev" aria-label="Previous player">‹</button>
      <div class="track" id="track" tabindex="0" aria-label="Players. Swipe or use the arrow keys."></div>
      <button type="button" class="deck-arrow" id="deck-next" aria-label="Next player">›</button>
    </div>
    <div class="deck-count" id="deck-count" aria-live="polite"></div>
    <div class="banner slim after">
      <small>Team goal</small>
      <strong id="team-goal"></strong>
    </div>
  </section>

  <!-- Tactics board: positions and set pieces -->
  <section id="v-board" class="board-view" hidden>
    <figure>
      <svg id="board" viewBox="-24 -30 728 1060" role="img" aria-label="Soccer field showing our 3-4-3 diamond and the movement for this step"></svg>
      <button type="button" class="btn small opp-toggle" aria-pressed="true">Defenders: on</button>
      <div class="legend" aria-hidden="true">
        <span><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="var(--acc)"/></svg><span id="lg-role">Focus</span></span>
        <span><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="var(--us)"/></svg>Us</span>
        <span><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--them)" stroke-width="2.5"/></svg>Them (defenders)</span>
        <span><svg width="28" height="10"><line x1="2" y1="5" x2="26" y2="5" stroke="var(--us)" stroke-width="3" stroke-dasharray="5 4"/></svg>Run</span>
        <span><svg width="28" height="10"><line x1="2" y1="5" x2="26" y2="5" stroke="var(--us)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.5 6"/></svg>Dribble</span>
        <span><svg width="28" height="10"><line x1="2" y1="5" x2="26" y2="5" stroke="var(--ink)" stroke-width="3"/></svg>Pass</span>
        <span><svg width="28" height="10"><line x1="2" y1="5" x2="26" y2="5" stroke="var(--acc)" stroke-width="4"/></svg>Shot / clear</span>
      </div>
    </figure>

    <section class="panel" aria-live="polite">
      <div>
        <div class="count" id="count"></div>
        <h2 id="title"></h2>
      </div>
      <div class="body" id="body"></div>
      <div class="cue"><small>Coach’s cue</small><strong id="cue"></strong></div>
      <div class="controls">
        <button id="prev" type="button" class="btn">Back</button>
        <button id="next" type="button" class="btn primary">Next</button>
        <button id="replay" type="button" class="btn accent spacer">▶ Play it</button>
      </div>
      <ol class="steps" id="steps"></ol>
      <div><button id="share" type="button" class="btn small">Copy link to this step</button> <span class="toast" id="toast" role="status"></span></div>
    </section>
  </section>
</main>
<script src="js/plays.js"></script>
<script src="js/team.js"></script>
<script src="js/app.js"></script>
</body>
</html>
